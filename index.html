<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>北京石景山</title>
    <style>
        /* 原有样式保持不变 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: #FFF;
        }

        .background-wrapper {
            width: 100vw;
            height: 100vh;
            background: url('整体bg.png') no-repeat center center;
            background-size: cover;
            position: relative;
            margin: 0 auto;
            display: none; /* 初始隐藏背景容器 */
        }

        .button-container {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s;
            display: none; /* 初始隐藏按钮容器 */
        }

        #btn-bg {
            display: block;
            height: auto;
        }

        .button-text {
            position: absolute;
            top: 43%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-family: Arial, sans-serif;
            pointer-events: none;
            white-space: nowrap;
        }
        /* 新增提示样式 */
        .browser-prompt {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 999;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .prompt-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            max-width: 80%;
        }

        .prompt-content p {
            margin: 0px 0;
            font-size: 40px;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <!-- 在页面底部添加提示层 -->
    <div class="browser-prompt">
        <div class="prompt-content">
            <p>检测到您正在使用微信访问<br>请点击右上角...选择<br>【在浏览器打开】进行下载</p>
        </div>
    </div>
    <div class="background-wrapper">
        <div class="button-container" onclick="handleDownload()">
            <img src="按钮-bg.png" id="btn-bg" alt="下载按钮">
            <div class="button-text">点击下载北京石景山客户端</div>
        </div>
    </div>

    <script>
        let imgRatio;
        const bgImg = new Image();
        let apkUrl = null; // 存储动态获取的下载地址
        
        // 预加载背景图获取原始尺寸
        bgImg.src = '整体bg.png';
        bgImg.onload = function() {
            imgRatio = this.width / this.height;
            updateLayout();
         // 背景图加载完成后显示背景容器和按钮
         const container = document.querySelector('.button-container');
        container.style.display = 'block';
        const backgroundWrapper = document.querySelector('.background-wrapper');
        backgroundWrapper.style.display = 'block';
        };

        // 获取最新下载地址
        async function fetchDownloadUrl() {
            try {
                const response = await fetch('https://cos.sjsrm.com/nams-res/apps/66f3b595e4b064c002b9432b/releases/devices/1/releases.json');
                const data = await response.json();
                
                if (data.code === 0 && data.data?.path) {
                    apkUrl = data.data.path;
                } else {
                    console.error('获取下载地址失败:', data.message);
                }
            } catch (error) {
                console.error('网络请求失败:', error);
            }
        }

        function calculateBgDimensions() {
            const container = document.querySelector('.background-wrapper');
            const cw = container.clientWidth;
            const ch = container.clientHeight;
            const containerRatio = cw / ch;

            if (containerRatio > imgRatio) {
                return {
                    width: ch * imgRatio,
                    height: ch,
                    top: 0,
                    left: (cw - ch * imgRatio) / 2
                }
            } else {
                return {
                    width: cw,
                    height: cw / imgRatio,
                    top: (ch - cw / imgRatio) / 2,
                    left: 0
                }
            }
        }

        function updateLayout() {
            if (!imgRatio) return;
            
            const container = document.querySelector('.button-container');
            const btn = document.getElementById('btn-bg');
            const text = document.querySelector('.button-text');
            
            const bg = calculateBgDimensions();
            
            btn.style.width = bg.width * 0.8 + 'px';
            
            const buttonTop = bg.top + bg.height * 0.77;
            container.style.top = `${buttonTop}px`;
            
            text.style.fontSize = bg.width * 0.045 + 'px';
        }

        // 新增微信环境判断函数
        function isWeixinBrowser() {
            const ua = navigator.userAgent.toLowerCase();
            return ua.includes('micromessenger');
        }

        // 显示浏览器提示
        function showBrowserPrompt() {
            document.querySelector('.browser-prompt').style.display = 'block';
        }

        async function handleDownload() {
            // 如果是微信环境
            if (isWeixinBrowser()) {
                showBrowserPrompt();
                return; // 直接返回不执行后续逻辑
            }
            // iOS直接跳转App Store
            if (navigator.userAgent.match(/(iPhone|iPod|iPad);?/i)) {
                window.location.href = "https://apps.apple.com/cn/app/%E5%8C%97%E4%BA%AC%E7%9F%B3%E6%99%AF%E5%B1%B1/id1185435616";
                return;
            }

            // 如果尚未获取到地址，先尝试获取
            if (!apkUrl) {
                await fetchDownloadUrl();
            }

            if (apkUrl) {
                window.location.href = apkUrl;
            } else {
                alert('暂时无法获取下载地址，请稍后再试');
            }
        }

        // 初始化操作
        window.addEventListener('resize', updateLayout);
        window.onload = () => {
            if (isWeixinBrowser()) {
            showBrowserPrompt();
        }
            updateLayout();
            fetchDownloadUrl(); // 页面加载时预获取下载地址
        };
    </script>

    <script>


 
    </script>
</body>
</html>
